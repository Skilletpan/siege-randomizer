name: Build App

on:
  pull_request:
    paths:
      - index.html
      - package.json
      - package-lock.json
      - public/**
      - src/**

  workflow_call:
    inputs:
      upload_artifact:
        default: false
        type: boolean

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v7

      - id: setup
        name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: install
        name: Install NPM packages
        run: npm install

      - id: build
        name: Build app
        run: npm run build

      - id: upload
        name: Create build artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v5
        with:
          path: dist
